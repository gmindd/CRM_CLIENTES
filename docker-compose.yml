services:
  crm:
    build: .
    container_name: crm-clientes
    restart: unless-stopped
    # Só acessível a partir do próprio VPS — quem expõe ao mundo é o Nginx.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/crm.sqlite
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
