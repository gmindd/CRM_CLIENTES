# /etc/nginx/sites-available/crm.pereiragabriel.com
# Depois: ln -s /etc/nginx/sites-available/crm.pereiragabriel.com /etc/nginx/sites-enabled/
#         certbot --nginx -d crm.pereiragabriel.com
#         nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name crm.pereiragabriel.com;

    # O Certbot acrescenta aqui o redirecionamento para HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.pereiragabriel.com;

    # Preenchido pelo Certbot:
    # ssl_certificate     /etc/letsencrypt/live/crm.pereiragabriel.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/crm.pereiragabriel.com/privkey.pem;

    # Este CRM é privado: fora dos motores de busca.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Ficheiros estáticos do Next.js: cache longo (têm hash no nome).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
